<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Image Pattern</title>
  <style>
    /* Prevent CLS with aspect-ratio containers */
    .image-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }
    .image-container img {
      width: 100%;
      height: auto;
      display: block;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }
    .product-card {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .product-card__image {
      aspect-ratio: 4 / 3;
      background: #f5f5f5;
      overflow: hidden;
    }
    .product-card__image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- ============================================
       PATTERN 1: Hero image with full format stack
       ============================================ -->
  <div class="image-container">
    <picture>
      <!-- AVIF: smallest file size, modern browsers -->
      <source
        type="image/avif"
        srcset="
          /img/hero-400.avif   400w,
          /img/hero-800.avif   800w,
          /img/hero-1200.avif 1200w,
          /img/hero-1600.avif 1600w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 80vw, 1200px"
      />
      <!-- WebP: wide support fallback -->
      <source
        type="image/webp"
        srcset="
          /img/hero-400.webp   400w,
          /img/hero-800.webp   800w,
          /img/hero-1200.webp 1200w,
          /img/hero-1600.webp 1600w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 80vw, 1200px"
      />
      <!-- JPEG: universal fallback -->
      <img
        src="/img/hero-1200.jpg"
        srcset="
          /img/hero-400.jpg   400w,
          /img/hero-800.jpg   800w,
          /img/hero-1200.jpg 1200w,
          /img/hero-1600.jpg 1600w
        "
        sizes="(max-width: 600px) 100vw, (max-width: 1200px) 80vw, 1200px"
        alt="Mountain landscape at sunset with orange sky"
        width="1600"
        height="900"
        fetchpriority="high"
        decoding="async"
      />
    </picture>
  </div>

  <!-- ============================================
       PATTERN 2: Art direction (different crops)
       ============================================ -->
  <picture>
    <!-- Mobile: square crop, tighter framing -->
    <source
      media="(max-width: 768px)"
      type="image/avif"
      srcset="/img/hero-mobile.avif"
    />
    <source
      media="(max-width: 768px)"
      type="image/webp"
      srcset="/img/hero-mobile.webp"
    />
    <!-- Desktop: wide crop -->
    <source
      type="image/avif"
      srcset="/img/hero-desktop.avif"
    />
    <source
      type="image/webp"
      srcset="/img/hero-desktop.webp"
    />
    <img
      src="/img/hero-desktop.jpg"
      alt="Team collaboration in office"
      width="1400"
      height="600"
      decoding="async"
    />
  </picture>

  <!-- ============================================
       PATTERN 3: Product grid with lazy loading
       ============================================ -->
  <section class="product-grid" aria-label="Products">
    <article class="product-card">
      <div class="product-card__image">
        <picture>
          <source
            type="image/avif"
            srcset="/img/product-1-300.avif 300w, /img/product-1-600.avif 600w"
            sizes="(max-width: 768px) 100vw, 300px"
          />
          <source
            type="image/webp"
            srcset="/img/product-1-300.webp 300w, /img/product-1-600.webp 600w"
            sizes="(max-width: 768px) 100vw, 300px"
          />
          <img
            src="/img/product-1-300.jpg"
            alt="Wireless headphones in matte black"
            width="600"
            height="450"
            loading="lazy"
            decoding="async"
          />
        </picture>
      </div>
    </article>

    <article class="product-card">
      <div class="product-card__image">
        <picture>
          <source
            type="image/avif"
            srcset="/img/product-2-300.avif 300w, /img/product-2-600.avif 600w"
            sizes="(max-width: 768px) 100vw, 300px"
          />
          <source
            type="image/webp"
            srcset="/img/product-2-300.webp 300w, /img/product-2-600.webp 600w"
            sizes="(max-width: 768px) 100vw, 300px"
          />
          <img
            src="/img/product-2-300.jpg"
            alt="Mechanical keyboard with RGB lighting"
            width="600"
            height="450"
            loading="lazy"
            decoding="async"
          />
        </picture>
      </div>
    </article>
  </section>

  <!--
    KEY TAKEAWAYS:
    - AVIF first (50-70% smaller than JPEG), WebP second, JPEG fallback
    - srcset with width descriptors (400w, 800w) + sizes attribute
    - sizes must match your CSS layout breakpoints
    - width + height on ALL images (prevents CLS)
    - loading="lazy" on below-fold only
    - fetchpriority="high" on LCP image only
    - decoding="async" on all (non-blocking decode)
  -->
</body>
</html>
