apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    team: platform
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "50"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: api-runner@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/repo/api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENV
              value: "production"
            - name: DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: db-connection-string
            - name: LOG_FORMAT
              value: "json"
          resources:
            limits:
              cpu: "2"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
  traffic:
    - revisionName: api-stable
      percent: 90
    - latestRevision: true
      percent: 10
      tag: canary
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker
    team: platform
  annotations:
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-egress: all-traffic
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 900
      serviceAccountName: worker-runner@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/repo/worker:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: ENV
              value: "production"
            - name: QUEUE_SUBSCRIPTION
              value: "projects/PROJECT_ID/subscriptions/tasks-sub"
          resources:
            limits:
              cpu: "4"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 10
  traffic:
    - latestRevision: true
      percent: 100
