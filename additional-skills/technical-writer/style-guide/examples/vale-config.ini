StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

Packages = Microsoft, alex, Readability

[*.md]
BasedOnStyles = Microsoft, ProjectVocab, alex
Microsoft.Accessibility = NO
Microsoft.Adverbs = suggestion
Microsoft.We = warning
Microsoft.Passive = suggestion
Microsoft.Wordiness = warning

[docs/**/*.md]
BasedOnStyles = Microsoft, ProjectVocab, alex, Readability
Readability.FleschKincaid = suggestion

[CHANGELOG.md]
BasedOnStyles = ProjectVocab
Microsoft.FirstPerson = NO
Microsoft.We = NO

[*.yaml]
BasedOnStyles = ProjectVocab

[*.tsx]
BasedOnStyles = ProjectVocab
