[project]
name = "zara-cli"
version = "1.0.0"
description = "Harness CLI for zara-agent-opc: one Python entry point for every gate."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
zara-cli = "zara_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zara_cli"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
